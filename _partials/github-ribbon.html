<!--
  PapyrCMS GitHub corner ribbon — mid-awe.com
  Drop this block anywhere inside <body> (position is fixed, so location in
  source doesn't matter). A simple link to the repo, upper-right corner.

  THEMING: it reads two CSS custom properties if present, with fallbacks:
    --ribbon-bg   (defaults to var(--accent), then a gold)
    --ribbon-fg   (defaults to var(--ink-deep), then near-black)
  So on the gold-token pages it picks up --accent automatically; on the
  blue portfolio you can set --ribbon-bg: var(--text-accent) in that page,
  or just let the fallback gold stand. No dependency on any framework.

  Accessible: real <a>, aria-label, keyboard-focusable, honors reduced-motion.
-->
<a class="gh-ribbon" href="https://github.com/MiD-AwE/papyr-cms"
   target="_blank" rel="noopener noreferrer"
   aria-label="PapyrCMS on GitHub — view the repository">
  <span class="gh-ribbon-inner">
    <svg class="gh-ribbon-mark" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span class="gh-ribbon-text">GitHub</span>
  </span>
</a>

<style>
  .gh-ribbon {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 4000;
    display: block;
    /* the ribbon sits on a 45° banner in the corner */
    width: 150px;
    height: 150px;
    overflow: hidden;
    text-decoration: none;
    pointer-events: none; /* only the banner itself is clickable */
  }
  .gh-ribbon-inner {
    pointer-events: auto;
    position: absolute;
    top: 34px;
    right: -42px;
    width: 170px;
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    padding: .38rem 0;
    background: var(--ribbon-bg, var(--accent, #c07820));
    color: var(--ribbon-fg, var(--ink-deep, #0a0806));
    font-family: 'Rajdhani', system-ui, sans-serif;
    font-weight: 700;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    transition: filter .2s ease, transform .2s ease;
  }
  .gh-ribbon-mark { display: block; }
  .gh-ribbon:hover .gh-ribbon-inner,
  .gh-ribbon:focus-visible .gh-ribbon-inner {
    filter: brightness(1.12);
  }
  .gh-ribbon:focus-visible .gh-ribbon-inner {
    outline: 2px solid var(--ribbon-fg, #0a0806);
    outline-offset: -4px;
  }
  @media (max-width: 560px) {
    .gh-ribbon { width: 116px; height: 116px; }
    .gh-ribbon-inner { top: 26px; right: -46px; font-size: .68rem; padding: .32rem 0; }
  }
</style>
